name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: crunch
          POSTGRES_PASSWORD: crunch
          POSTGRES_DB: crunch
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U crunch" --health-interval 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://crunch:crunch@localhost:5433/crunch_test
      DATABASE_URL: postgres://crunch:crunch@localhost:5433/crunch
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  browser:
    # Canvas (Stories 3.9/3.10) and export parity (7.1) suites run against self-contained
    # harnesses, so they need no Clerk secrets and run on every push.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @crunch/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @crunch/web e2e:canvas
      - run: pnpm --filter @crunch/web e2e:export
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  e2e:
    needs: check
    runs-on: ubuntu-latest
    # Signed-out smoke tests plus the app suite (e2e/app): real Clerk sign-in, roles, workspaces.
    # Needs a Clerk *development* instance (pk_test_/sk_test_); skipped until the secrets are
    # configured. The suite creates its own users and orgs per run and deletes them afterwards.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET_TEST }}
      CREDENTIALS_MASTER_KEYS: ${{ secrets.CREDENTIALS_MASTER_KEYS_TEST }}
      DATABASE_URL: postgres://crunch:crunch@localhost:5433/crunch
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: crunch, POSTGRES_PASSWORD: crunch, POSTGRES_DB: crunch }
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U crunch" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @crunch/web exec playwright install --with-deps
      - run: pnpm --filter @crunch/web build
      - run: pnpm --filter @crunch/web e2e
      - run: pnpm --filter @crunch/web e2e:app
        env:
          E2E_SKIP_BUILD: '1'
      # The teardown project normally deletes the run's Clerk users and orgs; if the run was
      # cancelled or crashed first, delete what it recorded.
      - if: cancelled() || failure()
        run: pnpm exec tsx apps/web/e2e/app/cleanup.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-app-report
          path: |
            apps/web/playwright-report
            apps/web/test-results/e2e-app
          retention-days: 7
