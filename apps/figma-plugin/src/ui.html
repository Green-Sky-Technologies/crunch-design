<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --fg: var(--figma-color-text, #1e1e1e);
        --muted: var(--figma-color-text-secondary, #757575);
        --bg: var(--figma-color-bg, #fff);
        --bg2: var(--figma-color-bg-secondary, #f5f5f5);
        --border: var(--figma-color-border, #e6e6e6);
        --accent: var(--figma-color-bg-brand, #0d99ff);
        --accent-fg: var(--figma-color-text-onbrand, #fff);
        --danger: var(--figma-color-text-danger, #f24822);
        --ok: var(--figma-color-text-success, #14ae5c);
        --warn: var(--figma-color-text-warning, #b86200);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          12px/1.4 Inter,
          system-ui,
          sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      #app {
        padding: 12px;
      }
      h3 {
        margin: 8px 0 4px;
        font-size: 12px;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 4px;
        cursor: default;
      }
      .row:hover,
      .row.selected {
        background: var(--bg2);
      }
      .row-label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .right {
        text-align: right;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 11px;
      }
      .list {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      .input,
      select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
      }
      button {
        font: inherit;
        padding: 6px 10px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--accent);
        color: var(--accent-fg);
        border-color: transparent;
      }
      button.link {
        border: 0;
        padding: 0;
        background: none;
        color: var(--accent);
      }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 8px;
      }
      .tab {
        border: 0;
        border-bottom: 2px solid transparent;
        border-radius: 0;
      }
      .tab.active {
        border-bottom-color: var(--accent);
        font-weight: 600;
      }
      .status {
        padding: 6px 8px;
        background: var(--bg2);
        border-radius: 4px;
      }
      .status.error {
        color: var(--danger);
      }
      .report {
        max-height: 200px;
        overflow: auto;
        font-size: 11px;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 8px;
        margin: 0;
        list-style: none;
      }
      .sev-error {
        color: var(--danger);
      }
      .sev-warning {
        color: var(--warn);
      }
      .diff-added {
        color: var(--ok);
      }
      .diff-removed,
      .diff-conflict {
        color: var(--danger);
      }
      .diff-changed {
        color: var(--warn);
      }
      code {
        font:
          11px ui-monospace,
          monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      /*__UI_BUNDLE__*/
    </script>
  </body>
</html>
