services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: crunch
      POSTGRES_PASSWORD: crunch
      POSTGRES_DB: crunch
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crunch']
      interval: 2s
      retries: 20
volumes:
  pgdata:
